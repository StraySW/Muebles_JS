<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-avatar">🔐</div>
      <h2>Iniciar Sesión</h2>
      <p>Ingresa a tu cuenta de Muebles JS</p>
    </div>

    <form (ngSubmit)="iniciarSesion()" class="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Tu contraseña"
          required
        />
      </div>

      @if (mensaje) {
        <div class="mensaje-alerta" [class.exito]="!esError" [class.error]="esError">
          {{ mensaje }}
        </div>
      }

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <div class="login-footer">
      <div class="registro-link">
        ¿No tienes cuenta? <a routerLink="/registro" class="link-destacado">Regístrate aquí</a>
      </div>
      <a routerLink="/inicio" class="btn-volver">Volver al Inicio</a>
    </div>
  </div>
</div>
