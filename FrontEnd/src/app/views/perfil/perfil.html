<div class="perfil-container">
  <div class="perfil-card">
    <div class="perfil-header">
      <div class="perfil-avatar">👤</div>
      <h2>Mi Perfil</h2>
      <p>Consulta y actualiza tus datos personales</p>
    </div>

    <form (ngSubmit)="guardarCambios()" class="perfil-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" name="nombre" [(ngModel)]="nombre" required />
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" name="apellido" [(ngModel)]="apellido" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="edad">Edad</label>
          <input id="edad" type="number" name="edad" [(ngModel)]="edad" />
        </div>
        <div class="form-group">
          <label for="sexo">Sexo</label>
          <select id="sexo" name="sexo" [(ngModel)]="sexo">
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      @if (mensaje) {
        <div class="mensaje-exito">
          {{ mensaje }}
        </div>
      }

      <div class="acciones-perfil">
        <button type="submit" class="btn-guardar">Guardar Cambios</button>
        <button type="button" (click)="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
      </div>
    </form>
  </div>
</div>
