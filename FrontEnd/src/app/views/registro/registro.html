<div class="registro-container">
  <div class="registro-card">
    <div class="registro-header">
      <div class="registro-avatar">📝</div>
      <h2>Crear Cuenta</h2>
      <p>Regístrate en Muebles JS</p>
    </div>

    <form (ngSubmit)="registrarse()" class="registro-form">
      <div class="form-group">
        <label for="cc">Cédula de Ciudadanía (CC) *</label>
        <input
          id="cc"
          type="text"
          name="cc"
          [(ngModel)]="cc"
          placeholder="Ej: 1020304050"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input
            id="nombre"
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Tu nombre"
            required
          />
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input
            id="apellido"
            type="text"
            name="apellido"
            [(ngModel)]="apellido"
            placeholder="Tu apellido"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico *</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input
          id="telefono"
          type="tel"
          name="telefono"
          [(ngModel)]="telefono"
          placeholder="Ej: 3001234567"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Crea una contraseña segura"
          required
        />
      </div>

      @if (mensaje) {
        <div class="mensaje-alerta" [class.exito]="!esError" [class.error]="esError">
          {{ mensaje }}
        </div>
      }

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <div class="registro-footer">
      <div class="login-link">
        ¿Ya tienes cuenta? <a routerLink="/login" class="link-destacado">Inicia sesión</a>
      </div>
      <a routerLink="/inicio" class="btn-volver">Volver al Inicio</a>
    </div>
  </div>
</div>
