@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="isHandset === false"
  >
    <mat-toolbar id="menustitle">Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/clientes">Perfil</a>
      <a mat-list-item routerLink="/catalogo">Catalogo</a>
      <a mat-list-item routerLink="/carrito">Carrito</a>
      <a mat-list-item routerLink="/categorias">Categorias</a>
      <a mat-list-item routerLink="/contacto">Contactanos</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      @if (isHandset) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
    <a [routerLink]="['/inicio']" aria-label="Ir a inicio" style="display: inline-flex; align-items: center; cursor: pointer;">
        <img src="/assets/MueblesJS_logo_horizontal_tex.png" alt="MueblesJS logo" width="180" height="45" style="margin-right: 8px;" />
      </a>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
