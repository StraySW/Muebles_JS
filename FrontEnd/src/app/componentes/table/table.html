<table class="tabla-dinamica">
  <thead>
    <tr>
      <th *ngFor="let column of columns">{{ column.label }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of dataSource; trackBy: trackByRow">
      <td *ngFor="let column of columns">{{ formatCell(row, column) }}</td>
    </tr>
  </tbody>
</table>
