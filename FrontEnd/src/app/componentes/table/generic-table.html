@if (displayColumns.length > 0) {
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 tabla-dinamica">

    <!-- Columnas dinámicas -->
    <ng-container *ngFor="let item of displayColumns" [matColumnDef]="item">
      <th mat-header-cell *matHeaderCellDef> {{ item }} </th>
      <td mat-cell *matCellDef="let element"> {{ element[item] }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>

  </table>
} @else {
  <p style="padding: 1.5rem; text-align: center; color: #6c757d; font-style: italic;">
    No hay datos registrados actualmente.
  </p>
}
